name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  GOLANGCI_LINT_VERSION: v1.64.8
  CGO_ENABLED: "1"
  GOFLAGS: "-tags=webkit2_41"

jobs:
  frontend:
    name: frontend (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Check and build the frontend
        working-directory: ui
        run: npm run build

      - name: Verify embedded frontend bundle is current
        run: |
          if [[ -n "$(git status --porcelain -- cmd/jide/frontend/dist)" ]]; then
            git status --short -- cmd/jide/frontend/dist
            echo "The embedded frontend bundle is stale; rebuild it from ui/ and commit the result."
            exit 1
          fi

  build:
    name: build/test/vet (${{ matrix.os }}, ${{ matrix.module }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        module:
          - internal/jlproc
          - internal/lsp
          - internal/syntax
          - internal/vfs
          - internal/workspace
          - proto/jide
          - cmd/jided
          - cmd/jide
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install Wails Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up MinGW for cgo
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'mingw64\bin')

      - name: Build (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Test (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Vet (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  workspace:
    name: workspace (ubuntu-latest)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install Wails Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # The workspace file is the contract between the modules. It must be
      # consistent and every module must build together with the others.
      - name: Sync the workspace
        run: go work sync

      - name: List the workspace modules
        run: go list -m all

      # "go build ./..." cannot be used at the repository root: the root is not
      # a module, so the pattern matches nothing. The module prefixes below
      # select every package of the workspace.
      - name: Build the whole workspace
        run: go build ./cmd/jide/... ./cmd/jided/... ./internal/jlproc/... ./internal/lsp/... ./internal/syntax/... ./internal/vfs/... ./internal/workspace/... ./proto/jide/...

      - name: Test the whole workspace
        run: go test ./cmd/jide/... ./cmd/jided/... ./internal/jlproc/... ./internal/lsp/... ./internal/syntax/... ./internal/vfs/... ./internal/workspace/... ./proto/jide/...

      - name: Vet the whole workspace
        run: go vet ./cmd/jide/... ./cmd/jided/... ./internal/jlproc/... ./internal/lsp/... ./internal/syntax/... ./internal/vfs/... ./internal/workspace/... ./proto/jide/...

  lint:
    name: lint (${{ matrix.os }}, ${{ matrix.module }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        module:
          - internal/jlproc
          - internal/lsp
          - internal/syntax
          - internal/vfs
          - internal/workspace
          - proto/jide
          - cmd/jided
          - cmd/jide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install Wails Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up MinGW for cgo
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MinGW compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path "${{ steps.msys2.outputs.msys2-location }}" 'mingw64\bin')

      - name: Lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --timeout=5m
